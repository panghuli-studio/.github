name: Secret scan

# Reusable workflow: scans the commits of the calling event with the gitleaks
# binary. Usage and upgrade steps are in docs/secret-scan.md.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for the scan job.
        type: string
        default: home-lab-runner-panghuli-studio

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    env:
      # Bump both together; the checksum is the linux_x64.tar.gz line of
      # gitleaks_<version>_checksums.txt on the release page.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version

      - name: Scan the commits of this event
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          is_commit() {
            [[ "$1" =~ ^[0-9a-f]{40,64}$ ]] && [[ ! "$1" =~ ^0+$ ]] \
              && git cat-file -e "$1^{commit}" 2>/dev/null
          }
          case "$EVENT_NAME" in
            pull_request | pull_request_target)
              if ! is_commit "$PR_BASE" || ! is_commit "$PR_HEAD"; then
                echo "PR commits $PR_BASE..$PR_HEAD are not in the checkout" >&2
                exit 1
              fi
              range="$PR_BASE..$PR_HEAD"
              ;;
            push)
              if ! is_commit "$PUSH_AFTER"; then
                echo "pushed commit $PUSH_AFTER is not in the checkout" >&2
                exit 1
              fi
              # A new branch has no previous tip and a force push may have
              # dropped it; both fall back to the whole history of the new tip.
              if is_commit "$PUSH_BEFORE"; then
                range="$PUSH_BEFORE..$PUSH_AFTER"
              else
                range="$PUSH_AFTER"
              fi
              ;;
            *)
              range="$GITHUB_SHA"
              ;;
          esac

          report="$RUNNER_TEMP/gitleaks-report.txt"
          template="$RUNNER_TEMP/gitleaks-report.tmpl"
          # Only location fields: the report never carries the matched text.
          cat > "$template" <<'EOF'
          {{ range . }}rule={{ .RuleID }} file={{ .File }} line={{ .StartLine }} commit={{ .Commit }} fingerprint={{ .Fingerprint }}
          {{ end }}
          EOF
          rm -f "$report"

          status=0
          "$RUNNER_TEMP/gitleaks/gitleaks" git . \
            --no-banner --no-color --redact --exit-code 2 \
            --log-opts="$range" \
            --report-format template --report-template "$template" \
            --report-path "$report" || status=$?

          case "$status" in
            0)
              echo "No secrets found in $range."
              ;;
            2)
              echo "gitleaks found secrets in $range:"
              cat "$report"
              {
                echo "### gitleaks found secrets in \`$range\`"
                echo
                echo '```'
                cat "$report"
                echo '```'
                echo
                echo "Revoke each secret first. Then remove it from the commits,"
                echo "or add its fingerprint to \`.gitleaksignore\` with a reason."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            *)
              echo "gitleaks failed with exit code $status" >&2
              exit "$status"
              ;;
          esac
